[project]
name = "home-assistant-logitech-z407"
version = "0.1.0"
description = "Home Assistant custom integration for the Logitech Z407 BLE speaker"
readme = "README.md"
requires-python = ">=3.13.2"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "homeassistant>=2025.5.0",
  "bleak>=0.22.3",
  "bleak-retry-connector>=3.7.0",
  "pytest>=8.3.0",
  "pytest-homeassistant-custom-component>=0.13.212",
  "ruff>=0.11.0",
  "pyright>=1.1.400",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["custom_components", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
